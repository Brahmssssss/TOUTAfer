name: Gardien 24h-24 et Sauvegarde TOUTA FER

on:
  # Se lance toutes les 6 heures (00h, 06h, 12h, 19h UTC = 20h Algérie) pour garder le site et Supabase éveillés 24h/24
  schedule:
    - cron: '0 0,6,12,19 * * *'
  workflow_dispatch:

jobs:
  keep_alive_and_backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Réveiller le site Streamlit 24h/24
        run: |
          curl -s -L https://ywhgn2r4sxh.streamlit.app > /dev/null
          echo "✅ Site Streamlit réveillé !"

      - name: Installer Python et Outils
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installer les librairies
        run: |
          pip install pandas supabase openpyxl

      - name: Réveiller Supabase et Envoyer le Bilan Mail
        env:
          EMAIL_USER: "TON_EMAIL@gmail.com"
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python backup_mail.py